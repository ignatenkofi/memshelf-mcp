name: install mcp-publisher (pinned)
description: >-
  Download one pinned mcp-publisher release for linux/amd64, check it against
  the sha256 from upstream's registry_<version>_checksums.txt before
  extracting it, and leave ./mcp-publisher in the workspace root (#194).
  The release's mcp-registry job and ci's registry-manifest job both use
  this action, so the pin lives here and nowhere else.
runs:
  using: composite
  steps:
    - name: Download, verify, extract
      shell: bash
      env:
        # Bumping: take the new tag's registry_<version>_checksums.txt from
        # https://github.com/modelcontextprotocol/registry/releases and copy
        # the hash of mcp-publisher_linux_amd64.tar.gz from it. Dependabot
        # does not see this pin; ci's registry-manifest job runs the bump on
        # its own PR, before any tag depends on it.
        MCP_PUBLISHER_VERSION: "1.8.1"
        MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
      run: |
        set -euo pipefail
        asset=mcp-publisher_linux_amd64.tar.gz
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" \
          "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${asset}"
        # A mismatch stops here with rc 1, before tar ever reads the archive.
        (cd "$RUNNER_TEMP" && echo "${MCP_PUBLISHER_SHA256}  ${asset}" | sha256sum -c -)
        tar -xzf "$RUNNER_TEMP/$asset" -C "$GITHUB_WORKSPACE" mcp-publisher
        "$GITHUB_WORKSPACE/mcp-publisher" --version
