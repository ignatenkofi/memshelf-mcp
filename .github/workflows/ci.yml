name: ci

# Lint + tests on every push and PR. Until this existed, `pytest` only ever ran
# inside the release gate (release.yml), so a test could break on main and stay
# invisible until a `v*` tag tried to cut a release — which is exactly how the
# git-identity failure reached the v0.1.0 tag.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ends of the declared range (classifiers: 3.10-3.13) — testing both
        # endpoints is the cheap guard that the classifiers are not lying.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: |
          # Предпосылка перед прогоном, а не после. 17 тестовых файлов начинаются
          # с `pytest.importorskip("docshelf_mcp")` / `("mcp")`, и для голого
          # чекаута это правильно. Но обе зависимости — жёсткие (pyproject
          # `dependencies`), поэтому здесь скип означает не «зависимости нет по
          # замыслу», а сломанную установку, и `pytest -q` в этом случае зелёный,
          # не проверив ничего. Ровно это правило уже сформулировано у соседа:
          # docshelf-mcp/.github/workflows/ci.yml — «if that ever dropped, the
          # skips would read green. Fail loudly.»
          python -c "import docshelf_mcp, mcp"
          pytest -q

  bundle:
    # The desktop bundle is assembled by a script and checked by starting it —
    # `mcpb validate` reads the manifest and would not notice an over-pruned
    # interpreter, a wheel built for the wrong ABI, or an `mcp_config` path that
    # is not in the zip. A bundle can only be started on the platform it targets,
    # so CI builds the linux one; every mistake in the shared machinery fails
    # identically on the macOS target.
    name: desktop bundle · build + run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: python3 adapters/claude-desktop/build.py --variant standalone --target linux-x86_64 --out dist
      - name: Start it and talk MCP to it
        run: python3 adapters/claude-desktop/try_bundle.py dist/*-linux-x86_64.mcpb
