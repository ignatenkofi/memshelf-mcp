name: ci

# Lint + tests on every push and PR. Until this existed, `pytest` only ever ran
# inside the release gate (release.yml), so a test could break on main and stay
# invisible until a `v*` tag tried to cut a release — which is exactly how the
# git-identity failure reached the v0.1.0 tag.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ends of the declared range (classifiers: 3.10-3.14) — testing both
        # endpoints is the cheap guard that the classifiers are not lying.
        # Moving the upper end means moving the last classifier with it (#199).
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: |
          # Предпосылка перед прогоном, а не после. Многие тестовые файлы начинаются
          # с `pytest.importorskip("docshelf_mcp")` / `("mcp")`, и для голого
          # чекаута это правильно. Но обе зависимости — жёсткие (pyproject
          # `dependencies`), поэтому здесь скип означает не «зависимости нет по
          # замыслу», а сломанную установку, и `pytest -q` в этом случае зелёный,
          # не проверив ничего. Ровно это правило уже сформулировано у соседа:
          # docshelf-mcp/.github/workflows/ci.yml — «if that ever dropped, the
          # skips would read green. Fail loudly.»
          python -c "import docshelf_mcp, mcp"
          pytest -q

  bundle:
    # The desktop bundle is assembled by a script and checked by starting it —
    # `mcpb validate` reads the manifest and would not notice an over-pruned
    # interpreter, a wheel built for the wrong ABI, or an `mcp_config` path that
    # is not in the zip. A bundle can only be started on the platform it targets,
    # so CI builds the linux one; every mistake in the shared machinery fails
    # identically on the macOS target.
    name: desktop bundle · build + run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: python3 adapters/claude-desktop/build.py --variant standalone --target linux-x86_64 --out dist
      - name: Start it and talk MCP to it
        run: python3 adapters/claude-desktop/try_bundle.py dist/*-linux-x86_64.mcpb

  registry-manifest:
    # #194 — release.yml's mcp-registry job runs only on a tag, after PyPI has
    # already published. This job runs the same pinned install (download +
    # `sha256sum -c`) and `mcp-publisher validate` on every PR and push, so a
    # wrong hash, a bad pin bump or a server.json the registry rejects turns a
    # PR red instead of a release. `validate` asks the live registry, so a
    # registry outage turns this job red too.
    name: server.json · mcp-publisher validate (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-mcp-publisher
      - name: Validate server.json
        # `validate` exits 0 on a deprecated `$schema` and only warns (v1.8.1,
        # measured on the 2025-09-29 schema), so the warning is made fatal
        # here: a deprecated schema is the step before a rejected one.
        shell: bash
        run: |
          ./mcp-publisher validate 2>&1 | tee "$RUNNER_TEMP/validate.log"
          if grep -qi 'deprecated' "$RUNNER_TEMP/validate.log"; then
            echo "::error file=server.json::mcp-publisher validate reports a deprecated \$schema; move server.json to the schema it names."
            exit 1
          fi

  pii-self-verify:
    # The tool redacts other people's episodes (shelf/POLICY.md, the redaction
    # pass in `shelve`) and must obey the no-real-PII policy itself: verify
    # the repository's own tree with pii-mcp. The baseline accepts the
    # synthetic findings by fingerprint — git identities the tests configure,
    # the author field, the bot identity in the shelf-repo adapter — and
    # anything else fails the job. Same shape as the "Self-verify" step in
    # pii-mcp's own ci.yml.
    #
    # pii-mcp is a private repository and this one is public, so the install
    # needs a read token: repository secret PII_MCP_READ_TOKEN (fine-grained,
    # Contents: read on ignatenkofi/pii-mcp). Without it the job fails loudly
    # instead of reading green — the same rule as the import line in `test`.
    # Fork PRs carry no secrets, so the job does not run for them at all.
    name: pii self-verify (the tree obeys its own no-PII policy)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pii-mcp (pinned commit)
        env:
          PII_MCP_READ_TOKEN: ${{ secrets.PII_MCP_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PII_MCP_READ_TOKEN}" ]; then
            echo "::error::PII_MCP_READ_TOKEN is not set — pii-mcp is a private repository and the self-verify cannot install it. Add a fine-grained token (Contents: read on ignatenkofi/pii-mcp) as a repository secret."
            exit 1
          fi
          git config --global url."https://x-access-token:${PII_MCP_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          python -m pip install --upgrade pip
          # A commit, not tip main (class #125: a guard that calls the head of
          # someone else's main changes meaning from run to run). Bump it in a
          # PR of its own, whose run shows the new rules against this tree.
          pip install --quiet "pii-mcp @ git+https://github.com/ignatenkofi/pii-mcp@45c31612e4bf000a0ab6ea22bea3999753fc2a1b"
      - name: Self-verify (the tool's policy, applied to this tree)
        # Built-in categories only — no pattern packs here, so the
        # named-category warning on stderr is expected.
        run: pii-mcp verify . --baseline tests/pii-baseline.json --format json
