name: release
# Tag v* -> gate (tests+lint) -> PyPI (Trusted Publishing) -> MCP Registry
# (GitHub OIDC). No stored secrets anywhere:
# - PyPI: configure a Trusted Publisher for project `memshelf-mcp`
#   (owner ignatenkofi, repo memshelf-mcp, workflow release.yml) at
#   https://pypi.org/manage/account/publishing/ — one-time manual step.
# - MCP Registry: the io.github.ignatenkofi/* namespace authenticates via
#   GitHub Actions OIDC (`mcp-publisher login github-oidc`), nothing to set up.
on:
  push:
    tags: ["v*"]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tag matches package version
        run: |
          PKG=$(python -c "import memshelf_mcp; print(memshelf_mcp.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          test "$PKG" = "$TAG" || { echo "tag v$TAG != __version__ $PKG"; exit 1; }
          python -c "import json; m=json.load(open('server.json')); \
            assert m['version']=='$TAG' and m['packages'][0]['version']=='$TAG', \
            'server.json version out of sync'"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q

  pypi:
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Делает релиз ВОЗОБНОВЛЯЕМЫМ. Джобы идут pypi → mcp-registry, и если
          # второй упал (у v0.1.0 — реестр отверг description длиннее 100), то
          # без этого флага повторный пуш того же тега разбивается о «файл уже
          # существует», и до реестра дело снова не доходит. Со skip-existing
          # PyPI-шаг тихо пропускает уже загруженную версию, а недоехавшие шаги
          # догоняют. Идемпотентность здесь важнее строгости: версию всё равно
          # сторожит гейт «тег = версия».
          skip-existing: true

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # MCP Registry GitHub OIDC login
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # #87 — ship the desktop bundles with the release. Until these jobs, the
  # only way to get a .mcpb was to clone and build one.
  #
  # Signing: `.github/actions/sign-bundles` signs when the repository holds
  # MCPB_SIGNING_CERT / MCPB_SIGNING_KEY (PEM, a code-signing certificate the
  # OS trust store vouches for) and leaves the bundles unsigned — loudly — when
  # it does not. A self-signed certificate buys nothing here: `mcpb verify`
  # reports it as "not signed", so the install warning would stay. The
  # certificate is an owner decision this workflow must not fake.
  #
  # Runs-on note: this is a public repo, hosted minutes are free here (macOS
  # included); the portfolio rule «hosted only where free» is satisfied.
  bundles:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/upload the GitHub release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the uv bundle and the linux standalone
        run: python3 adapters/claude-desktop/build.py --variant both --target linux-x86_64 --out dist
      - name: Start the linux standalone and talk MCP to it
        # The same live check ci runs on every PR: `mcpb validate` reads the
        # manifest and cannot notice an over-pruned interpreter or a wheel for
        # the wrong ABI; only starting the bundle can.
        run: python3 adapters/claude-desktop/try_bundle.py dist/*-linux-x86_64.mcpb
      - uses: ./.github/actions/sign-bundles
        with:
          dir: dist
          cert: ${{ secrets.MCPB_SIGNING_CERT }}
          key: ${{ secrets.MCPB_SIGNING_KEY }}
          intermediates: ${{ secrets.MCPB_SIGNING_INTERMEDIATES }}
      - name: Attach to the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/*.mcpb --clobber

  # The macOS bundle is built *and started* where it can be: on a macOS arm64
  # runner. Cross-building it on linux (the previous shape of this workflow)
  # proved the shared machinery, never the interpreter it ships.
  bundles-macos:
    needs: gate
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The runner is the bundle's platform
        # `macos-latest` is arm64 today (actions/runner-images README). If
        # GitHub ever re-points the label, this fails before a bundle that was
        # never started on its own platform can reach a release.
        run: test "$(uname -m)" = "arm64"
      - name: Build the macOS standalone
        run: python3 adapters/claude-desktop/build.py --variant standalone --target macos-arm64 --out dist
      - name: Start it and talk MCP to it
        run: python3 adapters/claude-desktop/try_bundle.py dist/*-macos-arm64.mcpb
      - uses: ./.github/actions/sign-bundles
        with:
          dir: dist
          cert: ${{ secrets.MCPB_SIGNING_CERT }}
          key: ${{ secrets.MCPB_SIGNING_KEY }}
          intermediates: ${{ secrets.MCPB_SIGNING_INTERMEDIATES }}
      - name: Attach to the GitHub release
        # Both bundle jobs may reach this step at once; `create` is best-effort
        # and `upload --clobber` is idempotent, so the order does not matter.
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/*.mcpb --clobber
