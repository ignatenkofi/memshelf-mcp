# shelf.yml — openshelf manifest (shelf-spec v0)
spec_version: "0.1"
mode: single
name: "memshelf-mcp — project shelf"
profile: memory
docs_root: docs
categories:
  - topics
  # `research` не объявлена, пока на полке нет ни одного эпизода этого вида:
  # shelf-spec даёт info `empty-category` на объявленную категорию без
  # документов, и пустой каталог этого не снимает. Первый эпизод
  # `--kind research` — вернуть строку сюда и в `category_order`
  # `.docshelf.json` (каталог без объявления — error `category-undeclared`).
  - sessions
index:
  path: INDEX.md
  generated_by: docshelf-mcp
ledger:
  path: ledger.tsv
policy:
  path: POLICY.md
  patterns: POLICY.patterns
