name: shelf-pr-guard
# PR возят эпизоды, производное коммитит бот на main (#58).
#
# Гард проверяет ровно то, что можно проверить НА ВЕТКЕ:
#   1) дифф не трогает производные пути — значит правится вход, а не выход;
#   2) сами эпизоды здоровы (схема, контракт дайджеста, секреты на диске).
#
# Чего здесь намеренно НЕТ: `memshelf rebuild --check`. На ветке производные
# файлы отстают на добавленный эпизод — это заложено дизайном и записано в
# README: «на ветке INDEX.md отстаёт на один эпизод». Вместе с проверкой (1)
# такой шаг делает красным КАЖДЫЙ shelve-PR: тронуть производные нельзя, а не
# тронув их, получаешь drifted ['ledger.tsv'].
#
# Место `--check` — в shelf-derived.yml на main, после регенерации, где он
# осмысленный: утверждение, что рендер — неподвижная точка.

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить memshelf
        run: pip install --quiet "memshelf-mcp @ git+https://github.com/ignatenkofi/memshelf-mcp"

      - name: Дифф PR не трогает производные пути
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE...HEAD")
          BAD=$(printf '%s\n' "$CHANGED" | grep -E '^(ledger\.tsv|INDEX\.md|stats\.svg|docs/[^/]+/\.meta\.json)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::PR правит производные файлы — их собирает бот на main (#58):"
            printf '  %s\n' $BAD
            echo "Правь эпизод в docs/, а не его отражение. Локально посмотреть: memshelf rebuild --shelf ."
            exit 1
          fi
          echo "дифф чист: производных путей не трогает"

      - name: Эпизоды здоровы
        run: memshelf doctor --shelf .
